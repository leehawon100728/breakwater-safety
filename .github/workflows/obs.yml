name: 기상청 관측값 갱신
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: obs
jobs:
  obs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AWS 매분자료 받기
        env:
          KMA_KEY: ${{ secrets.KMA_KEY }}
        run: python3 fetch_obs.py
      - name: 저장
        run: |
          git config user.name "obs-bot"
          git config user.email "obs-bot@users.noreply.github.com"
          git add obs.json
          git diff --cached --quiet || (git commit -q -m "관측값 갱신" && git push -q)
